name: core-check

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-check-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_OHOS_TAG: 3.41.10-ohos-1.0.1
  FLUTTER_OHOS_REVISION: adaf911c35c9136a7d18fc424d714c9ec7724e60
  APP_REF: 69656b4ab14e706e85907ef4c4205d8cd35a1338
  JAVA_REF: 60d97c783f29da767fafe503980812101f6aa61f

defaults:
  run:
    shell: bash
    working-directory: qfli_studio_core

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: qfli_studio_core
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: azurekiln2333/qflistudio-next
          ref: ${{ env.APP_REF }}
          path: qflistudio
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: azurekiln2333/qflistudio-java
          ref: ${{ env.JAVA_REF }}
          path: qfli_java
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ${{ runner.temp }}/flutter_ohos
            ~/.pub-cache
          key: core-ohos-${{ env.FLUTTER_OHOS_REVISION }}-${{ hashFiles('qfli_studio_core/pubspec.lock') }}
          restore-keys: core-ohos-${{ env.FLUTTER_OHOS_REVISION }}-
      - name: Install the pinned OHOS Flutter SDK
        run: |
          bash ../qflistudio/tool/ci/setup_flutter.sh "$RUNNER_TEMP/flutter_ohos" "$FLUTTER_OHOS_TAG" "$FLUTTER_OHOS_REVISION" --ohos
          echo "$RUNNER_TEMP/flutter_ohos/bin" >> "$GITHUB_PATH"
      - name: Resolve packages
        id: packages
        run: |
          flutter config --no-analytics
          flutter config --no-enable-ohos
          flutter pub get
      - name: Check changed Dart formatting
        run: |
          mapfile -d '' files < <(git diff-tree --root --no-commit-id --name-only --diff-filter=ACMR -r -z HEAD -- '*.dart')
          for required in test/interop_arkts_contract_test.dart test/interop_fixture_roots_test.dart test/support/interop_fixture_roots.dart; do
            if [ -f "$required" ] && [[ ! " ${files[*]} " == *" $required "* ]]; then
              files+=("$required")
            fi
          done
          if [ "${#files[@]}" -gt 0 ]; then
            dart format "${files[@]}"
            git diff --binary -- "${files[@]}" | tee "$RUNNER_TEMP/core-format.patch"
            test ! -s "$RUNNER_TEMP/core-format.patch"
          fi
      - name: Analyze
        if: ${{ !cancelled() && steps.packages.outcome == 'success' }}
        run: flutter analyze --no-pub --no-fatal-infos 2>&1 | tee "$RUNNER_TEMP/core-analyze.log"
      - name: Run the complete test suite
        id: tests
        if: ${{ !cancelled() && steps.packages.outcome == 'success' }}
        run: flutter test --no-pub --reporter json 2>&1 | tee "$RUNNER_TEMP/core-test.json"
      - name: Report failed tests
        if: ${{ !cancelled() && steps.tests.outcome == 'failure' }}
        env:
          TEST_LOG: ${{ runner.temp }}/core-test.json
        run: &report-failed-tests |
          python3 - "$TEST_LOG" <<'PY'
          import json, re, sys
          from collections import deque
          suites, tests, errors, stacks, prints = {}, {}, {}, {}, {}
          failures, tail = [], deque(maxlen=40)
          ROOT = re.compile(r'file:///\S*?/qfli_studio_core/')

          def escape(text):
              return text.replace('%', '%25').replace('\r', '').replace('\n', '%0A')

          def frames(text):
              # Keep only frames from our own sources and tests.
              out = []
              for f in text.splitlines():
                  f = ROOT.sub('', f.strip())
                  if ('package:qfli_studio_core/' in f or re.search(r'(^|[ (/])test/', f)) and f not in out:
                      out.append(f)
              return out[:8]

          def detail(tid):
              # Collapse adjacent copies before the annotation budget is applied.
              lines = errors.get(tid, '').strip().splitlines()[1:8]
              blocks = []
              for msg in prints.get(tid, []):
                  if 'EXCEPTION CAUGHT' not in msg:
                      continue
                  for block in re.split(r'(?m)^.*EXCEPTION CAUGHT[^\n]*(?:\n|$)', msg)[1:]:
                      kept = []
                      for line in block.splitlines():
                          if line.startswith(('When the exception was thrown', 'The relevant error-causing')):
                              break
                          if line.strip() and not line.startswith('══'):
                              kept.append(line.rstrip())
                      own_frames = frames(block)
                      key = (tuple(kept), tuple(own_frames))
                      if blocks and blocks[-1][0] == key:
                          blocks[-1][2] += 1
                      else:
                          blocks.append([key, kept[:14] + own_frames, 1])
              for _, block, count in blocks:
                  lines += block
                  if count > 1:
                      lines.append(f'[same exception repeated {count} times consecutively]')
              return lines + frames(stacks.get(tid, ''))

          try:
              log = open(sys.argv[1], encoding='utf-8', errors='replace')
          except OSError as error:
              print(f'::error title=All failed tests::{escape(str(error))[:60000]}')
              sys.exit(0)

          for line in log:
              tail.append(line.rstrip())
              line = line.strip()
              if not line.startswith('{'):
                  continue
              try:
                  e = json.loads(line)
              except ValueError:
                  continue
              kind = e.get('type')
              if kind == 'suite':
                  suites[e['suite']['id']] = e['suite'].get('path') or ''
              elif kind == 'testStart':
                  t = e['test']
                  tests[t['id']] = (suites.get(t.get('suiteID'), ''), t.get('name', '?'))
              elif kind == 'error':
                  errors.setdefault(e['testID'], e.get('error') or '')
                  stacks.setdefault(e['testID'], e.get('stackTrace') or '')
              elif kind == 'print':
                  prints.setdefault(e.get('testID'), []).append(e.get('message') or '')
              elif kind == 'testDone' and e.get('result') in ('failure', 'error'):
                  path, name = tests.get(e['testID'], ('', '?'))
                  lines = errors.get(e['testID'], '').strip().splitlines()
                  first = lines[0] if lines else e.get('result', '')
                  head = ' '.join(f'{path} :: {name} :: {first}'.split())
                  failures.append(head)
                  # Reserve error slot ten for the complete failure inventory.
                  number = len(failures)
                  level = 'error' if number <= 9 else 'warning' if number <= 19 else 'notice'
                  if number <= 29:
                      body = ['    ' + l.strip()[:240] for l in detail(e['testID']) if l.strip()]
                      text = escape('\n'.join([head] + body)[:4000])
                      print(f'::{level} title=Failed test::{text}')
          log.close()
          summary = '\n'.join(failures) if failures else (
              'Test command failed without completed failure events. Last output:\n' + '\n'.join(tail)
          )
          print(f'::error title=All failed tests::{escape(summary)[:60000]}')
          PY
      - name: Upload verification logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: core-verification-${{ github.sha }}
          path: |
            ${{ runner.temp }}/core-format.patch
            ${{ runner.temp }}/core-analyze.log
            ${{ runner.temp }}/core-test.json
          if-no-files-found: ignore

  interop-path-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: canonical
            core_path: qflistudio-core
            app_path: qflistudio
            java_path: qfli_java
          - mode: legacy
            core_path: qfli_studio_core
            app_path: qflistudio
            java_path: qfli_java
          - mode: relocated
            core_path: relocated/core
            app_path: relocated/fixtures/studio
            java_path: relocated/fixtures/java
          - mode: missing-app-root
            core_path: qflistudio-core
            app_path: qflistudio
            java_path: qfli_java
          - mode: invalid-java-root
            core_path: qflistudio-core
            app_path: qflistudio
            java_path: qfli_java
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: ${{ matrix.core_path }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: azurekiln2333/qflistudio-next
          ref: ${{ env.APP_REF }}
          path: ${{ matrix.app_path }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: azurekiln2333/qflistudio-java
          ref: ${{ env.JAVA_REF }}
          path: ${{ matrix.java_path }}
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ${{ runner.temp }}/flutter_ohos
            ~/.pub-cache
          key: core-interop-${{ env.FLUTTER_OHOS_REVISION }}-${{ hashFiles(format('{0}/pubspec.lock', matrix.core_path)) }}
          restore-keys: core-interop-${{ env.FLUTTER_OHOS_REVISION }}-
      - name: Verify GitHub-hosted runner and exact fixture layout
        working-directory: ${{ github.workspace }}
        env:
          CORE_PATH: ${{ matrix.core_path }}
          APP_PATH: ${{ matrix.app_path }}
          JAVA_PATH: ${{ matrix.java_path }}
          EXPECTED_CORE_SHA: ${{ github.sha }}
          EXPECTED_APP_SHA: ${{ env.APP_REF }}
          EXPECTED_JAVA_SHA: ${{ env.JAVA_REF }}
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          core="$GITHUB_WORKSPACE/$CORE_PATH"
          app="$GITHUB_WORKSPACE/$APP_PATH"
          java="$GITHUB_WORKSPACE/$JAVA_PATH"
          test "$(git -C "$core" rev-parse HEAD)" = "$EXPECTED_CORE_SHA"
          test "$(git -C "$app" rev-parse HEAD)" = "$EXPECTED_APP_SHA"
          test "$(git -C "$java" rev-parse HEAD)" = "$EXPECTED_JAVA_SHA"
          test -f "$core/pubspec.yaml"
          test -f "$app/ohos/entry/src/main/ets/interop/StudioInterop.ets"
          test -f "$app/ohos/entry/src/main/module.json5"
          test -f "$app/ohos/entry/src/main/resources/base/element/string.json"
          test -f "$java/ohos/entry/src/main/ets/interop/InteropReceiver.ets"
          test -f "$java/ohos/entry/src/main/module.json5"
          printf 'mode=%s\ncore_path=%s\ncore_sha=%s\napp_path=%s\napp_sha=%s\njava_path=%s\njava_sha=%s\n' '${{ matrix.mode }}' "$CORE_PATH" "$EXPECTED_CORE_SHA" "$APP_PATH" "$EXPECTED_APP_SHA" "$JAVA_PATH" "$EXPECTED_JAVA_SHA" | tee "$RUNNER_TEMP/interop-${{ matrix.mode }}-layout.txt"
      - name: Install the pinned OHOS Flutter SDK
        working-directory: ${{ github.workspace }}/${{ matrix.core_path }}
        run: |
          bash "$GITHUB_WORKSPACE/${{ matrix.app_path }}/tool/ci/setup_flutter.sh" "$RUNNER_TEMP/flutter_ohos" "$FLUTTER_OHOS_TAG" "$FLUTTER_OHOS_REVISION" --ohos
          echo "$RUNNER_TEMP/flutter_ohos/bin" >> "$GITHUB_PATH"
      - name: Resolve packages
        working-directory: ${{ github.workspace }}/${{ matrix.core_path }}
        run: |
          flutter config --no-analytics
          flutter config --no-enable-ohos
          flutter pub get
      - name: Check resolver negative-case unit tests
        if: ${{ matrix.mode == 'missing-app-root' || matrix.mode == 'invalid-java-root' }}
        working-directory: ${{ github.workspace }}/${{ matrix.core_path }}
        run: |
          set -o pipefail
          flutter test test/interop_fixture_roots_test.dart --reporter expanded 2>&1 | tee "$RUNNER_TEMP/interop-${{ matrix.mode }}-resolver-test.log"
      - name: Analyze complete suite with legacy sibling fixture defaults
        if: ${{ matrix.mode == 'canonical' || matrix.mode == 'legacy' }}
        working-directory: ${{ github.workspace }}/${{ matrix.core_path }}
        run: |
          set -o pipefail
          flutter analyze --no-pub --no-fatal-infos 2>&1 | tee "$RUNNER_TEMP/interop-${{ matrix.mode }}-analyze.log"
      - name: Run complete suite with legacy sibling fixture defaults
        if: ${{ matrix.mode == 'canonical' || matrix.mode == 'legacy' }}
        working-directory: ${{ github.workspace }}/${{ matrix.core_path }}
        run: |
          set -o pipefail
          flutter test --no-pub --reporter expanded 2>&1 | tee "$RUNNER_TEMP/interop-${{ matrix.mode }}-test.log"
      - name: Analyze complete suite with relocated fixture roots
        if: ${{ matrix.mode == 'relocated' }}
        working-directory: ${{ github.workspace }}/${{ matrix.core_path }}
        env:
          QFLI_STUDIO_APP_ROOT: ${{ github.workspace }}/${{ matrix.app_path }}
          QFLI_STUDIO_JAVA_ROOT: ${{ github.workspace }}/${{ matrix.java_path }}
        run: |
          set -o pipefail
          flutter analyze --no-pub --no-fatal-infos 2>&1 | tee "$RUNNER_TEMP/interop-${{ matrix.mode }}-analyze.log"
      - name: Run complete suite with relocated fixture roots
        if: ${{ matrix.mode == 'relocated' }}
        working-directory: ${{ github.workspace }}/${{ matrix.core_path }}
        env:
          QFLI_STUDIO_APP_ROOT: ${{ github.workspace }}/${{ matrix.app_path }}
          QFLI_STUDIO_JAVA_ROOT: ${{ github.workspace }}/${{ matrix.java_path }}
        run: |
          set -o pipefail
          flutter test --no-pub --reporter expanded 2>&1 | tee "$RUNNER_TEMP/interop-${{ matrix.mode }}-test.log"
      - name: Require missing App root to fail clearly
        if: ${{ matrix.mode == 'missing-app-root' }}
        working-directory: ${{ github.workspace }}/${{ matrix.core_path }}
        env:
          QFLI_STUDIO_APP_ROOT: ${{ github.workspace }}/missing-app-fixture
          EXPECTED_FIXTURE_ERROR: QFLI_STUDIO_APP_ROOT
          EXPECTED_FIXTURE_PATH: ${{ github.workspace }}/missing-app-fixture
        run: |
          set +e
          flutter test test/interop_arkts_contract_test.dart --reporter expanded > "$RUNNER_TEMP/interop-${{ matrix.mode }}-negative.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/interop-${{ matrix.mode }}-negative.log"
          if [ "$status" -eq 0 ]; then
            echo "Expected missing App fixture root to fail" >&2
            exit 1
          fi
          grep -F "$EXPECTED_FIXTURE_ERROR" "$RUNNER_TEMP/interop-${{ matrix.mode }}-negative.log"
          grep -F "$EXPECTED_FIXTURE_PATH" "$RUNNER_TEMP/interop-${{ matrix.mode }}-negative.log"
      - name: Require invalid Java root to fail with its missing fixture
        if: ${{ matrix.mode == 'invalid-java-root' }}
        working-directory: ${{ github.workspace }}/${{ matrix.core_path }}
        env:
          QFLI_STUDIO_JAVA_ROOT: ${{ github.workspace }}/${{ matrix.java_path }}/ohos/entry/src/main
          EXPECTED_FIXTURE_ERROR: QFLI_STUDIO_JAVA_ROOT
          EXPECTED_FIXTURE_PATH: ${{ github.workspace }}/${{ matrix.java_path }}/ohos/entry/src/main/ohos/entry/src/main/ets/interop/InteropReceiver.ets
        run: |
          set +e
          flutter test test/interop_arkts_contract_test.dart --reporter expanded > "$RUNNER_TEMP/interop-${{ matrix.mode }}-negative.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/interop-${{ matrix.mode }}-negative.log"
          if [ "$status" -eq 0 ]; then
            echo "Expected invalid Java fixture root to fail" >&2
            exit 1
          fi
          grep -F "$EXPECTED_FIXTURE_ERROR" "$RUNNER_TEMP/interop-${{ matrix.mode }}-negative.log"
          grep -F "$EXPECTED_FIXTURE_PATH" "$RUNNER_TEMP/interop-${{ matrix.mode }}-negative.log"
      - name: Upload portability evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: interop-path-${{ matrix.mode }}-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/interop-${{ matrix.mode }}-*
          if-no-files-found: warn
          retention-days: 14

  screenshots:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: qfli_studio_core
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: azurekiln2333/qflistudio-next
          ref: ${{ env.APP_REF }}
          path: qflistudio
          persist-credentials: false
      - name: Install screenshot fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ${{ runner.temp }}/flutter_ohos
            ~/.pub-cache
          key: core-shots-ohos-${{ env.FLUTTER_OHOS_REVISION }}-${{ hashFiles('qfli_studio_core/pubspec.lock') }}
          restore-keys: core-ohos-${{ env.FLUTTER_OHOS_REVISION }}-
      - name: Install the pinned OHOS Flutter SDK
        working-directory: qfli_studio_core
        run: |
          bash ../qflistudio/tool/ci/setup_flutter.sh "$RUNNER_TEMP/flutter_ohos" "$FLUTTER_OHOS_TAG" "$FLUTTER_OHOS_REVISION" --ohos
          echo "$RUNNER_TEMP/flutter_ohos/bin" >> "$GITHUB_PATH"
      - name: Resolve packages
        id: packages
        working-directory: qfli_studio_core
        run: |
          flutter config --no-analytics
          flutter config --no-enable-ohos
          flutter pub get
      - name: Capture workbench screenshots
        id: tests
        working-directory: qfli_studio_core
        env:
          QFLI_SCREENSHOTS: '1'
        run: flutter test --no-pub test/screenshots/workbench_screenshots_test.dart --reporter json 2>&1 | tee "$RUNNER_TEMP/workbench-screenshots.json"
      - name: Report failed tests
        if: ${{ !cancelled() && steps.tests.outcome == 'failure' }}
        env:
          TEST_LOG: ${{ runner.temp }}/workbench-screenshots.json
        run: *report-failed-tests
      - name: Upload workbench screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: workbench-screenshots-${{ github.sha }}
          path: |
            qfli_studio_core/build/screenshots/*.png
            ${{ runner.temp }}/workbench-screenshots.json
          if-no-files-found: warn
